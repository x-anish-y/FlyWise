# ============================================================
# FlyWise Data Collection — GitHub Actions Workflow
# Replaces Render Cron Job (runs every 4 hours)
# ============================================================

name: FlyWise Data Collection

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium browser
        run: playwright install --with-deps chromium

      - name: Run collection + ingestion pipeline
        run: python collectors/render_cron_entrypoint.py
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}
          BRIGHT_DATA_ZONE: ${{ secrets.BRIGHT_DATA_ZONE }}
          SCRAPPA_API_KEY: ${{ secrets.SCRAPPA_API_KEY }}
